name: knowledgeops-local
x-app: &app
  image: knowledgeops:0.1.0-local
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 96
  mem_limit: 128m
  cpus: 0.2
  logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  networks: [knowledgeops]

services:
  db:
    image: knowledgeops-postgres:18-local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_compose.py first}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Required}
      APP_PASSWORD: ${APP_PASSWORD:?Required}
    volumes:
      - knowledgeops-db:/var/lib/postgresql
      - ./operations/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=32MB", "-c", "log_statement=none"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgeops"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 0.2
    pids_limit: 96
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
    networks: [knowledgeops]
  migrate:
    <<: *app
    restart: "no"
    environment:
      KO_DATABASE_URL: postgresql://knowledgeops_owner:${OWNER_PASSWORD}@db/knowledgeops
      KO_MIGRATION_URL: postgresql://knowledgeops_owner:${OWNER_PASSWORD}@db/knowledgeops
    command: ["python", "scripts/migrate_and_seed.py"]
    depends_on: {db: {condition: service_healthy}}
  api:
    <<: *app
    build: .
    networks: [knowledgeops, ingress]
    environment:
      KO_DATABASE_URL: postgresql://knowledgeops_app:${APP_PASSWORD}@db/knowledgeops
      KO_PUBLIC_ORIGIN: ${KO_PUBLIC_ORIGIN:-http://127.0.0.1:8045}
      KO_SECURE_COOKIES: ${KO_SECURE_COOKIES:-false}
    ports: ["127.0.0.1:${KO_HOST_PORT:-8045}:8044"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8044/api/projects/knowledgeops/ready',headers={'Host':__import__('urllib.parse',fromlist=['urlparse']).urlparse(__import__('os').environ['KO_PUBLIC_ORIGIN']).netloc}),timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
  worker:
    <<: *app
    healthcheck:
      test: [CMD, python, -m, knowledgeops.worker_health]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      KO_DATABASE_URL: postgresql://knowledgeops_app:${APP_PASSWORD}@db/knowledgeops
    command: ["python", "-m", "knowledgeops.worker"]
    depends_on: {migrate: {condition: service_completed_successfully}}
networks:
  knowledgeops: {internal: true}
  ingress: {}
volumes:
  knowledgeops-db:

