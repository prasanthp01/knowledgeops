[project]
name = "knowledgeops"
version = "0.2.1"
description = "Permission-aware retrieval with verifiable passage citations"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1", "pypdf>=6,<7", "jsonschema>=4.23,<5"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledgeops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["knowledgeops/vendor_contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["knowledgeops/vendor_contracts"]

