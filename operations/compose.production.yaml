name: knowledgeops_prod
x-app: &app
  image: ${KO_IMAGE:?Set the verified immutable app image}
  restart: unless-stopped
  read_only: true
  init: true
  tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 96
  mem_limit: 128m
  cpus: 0.2
  logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  networks: [database]
services:
  db:
    image: ${KO_POSTGRES_IMAGE:?Set the verified immutable database image}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: knowledgeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Required}
      APP_PASSWORD: ${APP_PASSWORD:?Required}
    volumes:
      - data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=32MB", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "log_statement=none"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgeops"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 0.2
    pids_limit: 96
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
    networks: [database]
  migrate:
    <<: *app
    restart: "no"
    environment:
      KO_DATABASE_URL: postgresql://knowledgeops_owner:${OWNER_PASSWORD}@db/knowledgeops
      KO_MIGRATION_URL: postgresql://knowledgeops_owner:${OWNER_PASSWORD}@db/knowledgeops
    command: ["python", "scripts/migrate_and_seed.py"]
    depends_on: {db: {condition: service_healthy}}
  api:
    <<: *app
    environment:
      KO_DATABASE_URL: postgresql://knowledgeops_app:${APP_PASSWORD}@db/knowledgeops
      KO_PUBLIC_ORIGIN: ${KO_PUBLIC_ORIGIN:?Set the HTTPS origin for your deployment}
      KO_SECURE_COOKIES: "true"
    volumes:
      - ../portfolio-evidence.json:/app/portfolio-evidence.json:ro
    networks:
      database: {}
      edge: {aliases: [knowledgeops-api]}
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8044/api/projects/knowledgeops/ready',headers={'Host':__import__('urllib.parse',fromlist=['urlparse']).urlparse(__import__('os').environ['KO_PUBLIC_ORIGIN']).netloc}),timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
  worker:
    <<: *app
    healthcheck:
      test: [CMD, python, -m, knowledgeops.worker_health]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      KO_DATABASE_URL: postgresql://knowledgeops_app:${APP_PASSWORD}@db/knowledgeops
    command: ["python", "-m", "knowledgeops.worker"]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  data: {name: knowledgeops_prod_data}
networks:
  database: {name: knowledgeops_database, internal: true}
  edge: {name: knowledgeops_edge, internal: true}
