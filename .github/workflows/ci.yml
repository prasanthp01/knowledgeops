name: KnowledgeOps verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --frozen
      - name: Start the documented isolated test database
        run: |
          uv run python scripts/configure_tests.py
          docker compose --env-file .env.test -f compose.test.yaml up -d --wait
      - name: Static and contract checks
        run: |
          uv run ruff check knowledgeops tests scripts migrations
          uv run ruff format --check knowledgeops tests scripts migrations
          uv run mypy knowledgeops
          uv run python scripts/export_contracts.py
          git diff --exit-code schemas
      - name: Test
        run: uv run --env-file .env.test pytest -q --junitxml=docs/evidence/ci-pytest.xml
      - name: Source hygiene
        run: uv run python scripts/check_source.py
      - name: Dependency vulnerability audit
        run: uv run pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Container build
        run: |
          docker build -t knowledgeops:ci .
          docker build -f Dockerfile.postgres -t knowledgeops-postgres:ci .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-receipt
          path: docs/evidence/ci-pytest.xml
          retention-days: 7

      - name: Stop only the test database
        if: always()
        run: docker compose --env-file .env.test -f compose.test.yaml down
