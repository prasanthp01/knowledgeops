name: KnowledgeOps verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: knowledgeops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      KO_TEST_DATABASE_URL: postgresql://knowledgeops_app:isolated-ci-app@127.0.0.1:5432/knowledgeops_test
      KO_TEST_MIGRATION_URL: postgresql://knowledgeops_owner:isolated-ci-owner@127.0.0.1:5432/knowledgeops_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --frozen
      - name: Create restricted test roles
        run: |
          PGPASSWORD=isolated-ci-password psql -h 127.0.0.1 -U postgres -d knowledgeops_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE knowledgeops_owner LOGIN PASSWORD 'isolated-ci-owner' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE knowledgeops_app LOGIN PASSWORD 'isolated-ci-app' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          ALTER DATABASE knowledgeops_test OWNER TO knowledgeops_owner;
          GRANT ALL ON SCHEMA public TO knowledgeops_owner;
          SQL
      - name: Static and contract checks
        run: |
          uv run ruff check knowledgeops tests scripts migrations
          uv run ruff format --check knowledgeops tests scripts migrations
          uv run mypy knowledgeops
          uv run python scripts/export_contracts.py
          git diff --exit-code schemas
      - name: Test
        run: uv run pytest -q --junitxml=docs/evidence/ci-pytest.xml
      - name: Source hygiene
        run: uv run python scripts/check_source.py
      - name: Dependency vulnerability audit
        run: uv run pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Container build
        run: |
          docker build -t knowledgeops:ci .
          docker build -f Dockerfile.postgres -t knowledgeops-postgres:ci .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-receipt
          path: docs/evidence/ci-pytest.xml
          retention-days: 7

